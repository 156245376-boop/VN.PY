[project]
name = "qf-tqsdk"
version = "0.1.0"
description = "个人国内期货策略研究的天勤环境"
requires-python = "==3.13.*"
dependencies = ["tqsdk==3.10.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.16.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
